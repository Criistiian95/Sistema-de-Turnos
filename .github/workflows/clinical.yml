name: Verificar historia clínica
on:
  push:
    branches: [main, clinical-history]
    paths: ['backend/**', '.github/workflows/clinical.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clinical:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci-password
          MYSQL_DATABASE: clinical_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pisolated-ci-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Instalar Node 24 en el runner
        run: |
          NODE_VERSION=v24.13.1
          curl --fail --silent --show-error "https://nodejs.org/dist/$NODE_VERSION/node-$NODE_VERSION-linux-x64.tar.xz" -o /tmp/node.tar.xz
          tar -xJf /tmp/node.tar.xz -C /tmp
          echo "/tmp/node-$NODE_VERSION-linux-x64/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm test
      - name: Migración y módulo clínico con MySQL 8.4 aislado
        env:
          SISMED_CLINICAL_TEST_MYSQL_URL: mysql://root:isolated-ci-password@127.0.0.1:3306/clinical_test
        run: node --test backend/test/clinical.test.js
